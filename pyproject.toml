[project]
name = "prim"
version = "5.0.0"
description = "原语 CLI(六入口收敛五入口,2026-11-18 用户裁):shares/streams/ctxs/ports/pipes;agents/desks/machines 退役(归 hc/herdr-app 原生面);动词对齐 hc(ls/get/put/send/start/close)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "pyyaml>=6.0"]

[project.scripts]
shares = "prim.cli:shares_main"
streams = "prim.cli:streams_main"
ctxs = "prim.cli:ctxs_main"
ports = "prim.cli:ports_main"
pipes = "prim.cli:pipes_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/prim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
